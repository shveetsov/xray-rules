name: Build geodata for Mihomo and Xray

on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'
  push:
    branches: [main, master]
    paths:
      - 'geosite/data/**'
      - 'geoip/data/**'
      - 'router/**'
      - 'tools/**'
      - 'tests/**'
      - 'sources.json'
      - '.github/workflows/build.yml'
      - 'README.md'

concurrency:
  group: geodata-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test merge and router update failures
        run: python3 -m unittest discover -s tests -v
      - name: Build custom and merged databases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/build.py
      - name: Validate every category with Mihomo
        run: |
          curl -fLsS --retry 2 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz -o /tmp/mihomo.gz
          gzip -d /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          python3 tools/check_mihomo.py --binary /tmp/mihomo --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: geodata-assets
          path: dist/
      - name: Release tag
        id: tag
        run: echo "value=$(date -u +'%Y%m%d%H%M%S')-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Geodata ${{ steps.tag.outputs.value }}
          make_latest: true
          body: |
            GeoSite.dat и GeoIP.dat: V2Fly + Re:filter + ZKeen + shvetsov-all.
            Категории и количество записей: categories.md. Источники и SHA-256: manifest.json.
            Отдельные geosite_shvetsov.dat и geoip_shvetsov.dat сохранены для существующих Xray.
          files: dist/*
          fail_on_unmatched_files: true
